name: Build TurboLite Android Beta

on:
  push:
    paths:
      - "TurboLite/**"
      - ".github/workflows/build-turbolite-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TurboLite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboLite-beta-debug-apk
          path: TurboLite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
